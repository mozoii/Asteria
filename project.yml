name: Asteria
options:
  bundleIdPrefix: io.github.mozoii
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true

configs:
  Debug: debug
  Release: release

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Apple Silicon only, no Intel.
    EXCLUDED_ARCHS: x86_64

packages:
  AsteriaKit:
    path: AsteriaKit

targets:
  # macOS app. Signed with the self-signed identity bootstrap.sh provisions, so no Apple
  # Developer account is needed.
  Asteria:
    type: application
    platform: macOS
    sources:
      - path: Asteria
        excludes:
          - "Platform/iOS/**"
          - "Platform/macOS/Info.plist"
          - "Platform/macOS/Asteria.entitlements"
      - path: Assets.xcassets
    settings:
      base:
        SUPPORTED_PLATFORMS: macosx
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Asteria Development (Self-Signed)"
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mozoii.playasteria
        PRODUCT_NAME: Asteria
        INFOPLIST_FILE: Asteria/Platform/macOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Asteria/Platform/macOS/Asteria.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_HARDENED_RUNTIME: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Asteria
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.games"
        # Release version shown in About and What's New; bump by hand when cutting a release.
        MARKETING_VERSION: "0.1.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.mozoii.playasteria.debug
    dependencies:
      - package: AsteriaKit
        product: AsteriaKit

  # iOS / iPadOS app. Shares every non-platform source file with the Mac target; signing is
  # automatic because a self-signed identity cannot run on an iOS device. Set
  # ASTERIA_DEVELOPMENT_TEAM in Local.xcconfig (see Local.xcconfig.example).
  AsteriaMobile:
    type: application
    platform: iOS
    sources:
      - path: Asteria
        excludes:
          - "Platform/macOS/**"
          - "Platform/iOS/Info.plist"
          - "Platform/iOS/AsteriaMobile.entitlements"
      - path: Assets.xcassets
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # iOS requires CFBundleIconName in the bundle; with a hand-written Info.plist Xcode won't
        # inject it, so the catalog name is stated in both places.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Indirect on purpose: xcodegen copies a literal DEVELOPMENT_TEAM into the committed project
        # file, so the team id is read through a variable that only the gitignored xcconfig defines.
        DEVELOPMENT_TEAM: $(ASTERIA_DEVELOPMENT_TEAM)
        PRODUCT_BUNDLE_IDENTIFIER: io.github.mozoii.playasteria
        PRODUCT_NAME: Asteria
        INFOPLIST_FILE: Asteria/Platform/iOS/Info.plist
        CODE_SIGN_ENTITLEMENTS: Asteria/Platform/iOS/AsteriaMobile.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "0.1.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: io.github.mozoii.playasteria.debug
    dependencies:
      - package: AsteriaKit
        product: AsteriaKit

# Shared schemes, committed so they survive `xcodegen generate`.
schemes:
  Debug:
    build:
      targets:
        Asteria: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
  Release:
    build:
      targets:
        Asteria: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
  Debug-iOS:
    build:
      targets:
        AsteriaMobile: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Debug
    analyze:
      config: Debug
    archive:
      config: Debug
  Release-iOS:
    build:
      targets:
        AsteriaMobile: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
